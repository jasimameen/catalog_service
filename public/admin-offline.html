<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5fce" />
    <title>HV Catalog</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #fff;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      }
      main { text-align: center; max-width: 20rem; }
      img { width: 56px; height: 56px; }
      h1 { margin: 1rem 0 0.4rem; font-size: 1.25rem; letter-spacing: -0.02em; }
      p { margin: 0; font-size: 0.94rem; line-height: 1.45; color: #5a6472; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" width="56" height="56" />
      <h1>You’re offline</h1>
      <p>Reconnect to see new tickets. Alerts still arrive if this app is on your Home Screen and Notify is on.</p>
    </main>
  </body>
</html>
